# Render Blueprint — Backend API (Neon PostgreSQL + Vercel frontend)
# Docs: https://render.com/docs/blueprint-spec
#
# Setup:
# 1. Connect this repo in Render Dashboard → New → Blueprint
# 2. Set DATABASE_URL to your Neon connection string (see docs/DEPLOYMENT_PRODUCTION.md)
# 3. Set JWT secrets and FRONTEND_URL to your Vercel domain

services:
  - type: web
    name: crm-api
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "100"
      - key: FRONTEND_URL
        sync: false
      - key: API_URL
        sync: false
